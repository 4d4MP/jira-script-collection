repos:
  # Matches pyproject.toml's ruff==0.16.0 pin (see [project.optional-dependencies]).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-added-large-files

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

# mypy and pytest are intentionally not wired into pre-commit: both are slow
# enough to make local hooks painful, and CI (.github/workflows/ci.yml) already
# runs them on every push and pull_request.
